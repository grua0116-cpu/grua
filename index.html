<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>GRUA CAMPUS POSITION</title>

  <style>
    :root{
      --bg:#070b10; --panel:#0d141d; --line:#1f2b3a;
      --txt:#e9f1ff; --muted:#9fb0c8; --warn:#ffd38a; --err:#ff8aa0;
    }
    body{margin:0;background:var(--bg);color:var(--txt);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Noto Sans KR,sans-serif;}
    .wrap{max-width:980px;margin:0 auto;padding:34px 18px 72px;}
    h1{font-size:24px;letter-spacing:.3px;margin:0 0 8px;}
    .sub{color:var(--muted);margin:0 0 18px;font-size:13px;line-height:1.5}
    .meta{font-size:11px;letter-spacing:.08em;color:var(--muted);text-align:right;margin-bottom:12px;}

    .notice{
      margin:14px 0 16px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.20);
      color:var(--muted);
      font-size:12px;
      line-height:1.6;
    }
    .notice b{color:var(--warn);}

    .grid{display:grid;grid-template-columns:1fr;gap:12px;}
    .qcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;}
    .q{font-size:14px;line-height:1.5;margin:0 0 10px;}
    select{width:100%;background:#0a1018;color:var(--txt);border:1px solid var(--line);
      border-radius:12px;padding:10px 12px;font-size:14px;outline:none;}

    .actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 0;}
    button{background:#e9f1ff;color:#0b1220;border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer;}
    button.secondary{background:transparent;color:var(--txt);border:1px solid var(--line);}
    button:disabled{opacity:.45;cursor:not-allowed;}

    /* progress */
    .prog{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:0 0 10px;}
    .bar{width:100%;height:10px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);overflow:hidden;}
    .fill{height:100%;width:0%;background:linear-gradient(90deg, rgba(191,230,255,.95), rgba(170,255,220,.85));transition:width .18s ease;}

    /* result image */
    #resultImgWrap{
      display:none;margin-top:18px;
      background:rgba(0,0,0,.18);border:1px solid var(--line);
      border-radius:18px;padding:14px;
    }
    #resultImg{
      width:100%;max-height:520px;object-fit:contain;
      border-radius:14px;border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.18);display:block;
    }
    .err{display:none;margin-top:10px;color:var(--err);font-size:12px;line-height:1.55;white-space:pre-wrap;}
    .smallnote{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.6;}
    .link{color:#bfe6ff;text-decoration:underline;word-break:break-all;}
  </style>
</head>

<body>
  <div class="wrap">
    <h1>GRUA CAMPUS POSITION</h1>
    <p class="sub">32문항 응답이 완료되면 자동으로 결과(이미지)가 표시됩니다.</p>
    <div class="meta">Output: IMAGE ONLY · Auto + Manual</div>

    <!-- 항상 보이는 진단/진행 -->
    <div class="prog">
      <div id="progText">진행 0 / 32</div>
      <div id="jsAlive">JS: (확인중)</div>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>

    <div class="notice" id="noticeBox">
      <b>안내</b> 각 문항은 “선택하세요” 상태로 시작합니다. 32개 모두 선택해야 결과가 뜹니다.
    </div>

    <div class="grid" id="questions"></div>

    <!-- 버튼은 항상 보이게 -->
    <div class="actions">
      <button id="showResultBtn" disabled>결과 보기</button>
      <button class="secondary" id="resetBtn">전체 초기화</button>
    </div>

    <div id="resultImgWrap">
      <img id="resultImg" alt="result image" />
      <div class="err" id="imgErr"></div>
      <div class="smallnote" id="imgDebug"></div>
    </div>
  </div>

  <script>
    // ====== “JS 실행 중” 표시 (이게 안 바뀌면 JS 자체가 안 도는 것) ======
    document.getElementById("jsAlive").innerText = "JS: RUNNING";

    // ====== 옵션 ======
    const OPTIONS = [
      ["0", "전혀 아니다"],
      ["1", "아니다"],
      ["2", "보통이다"],
      ["3", "그렇다"],
      ["4", "매우 그렇다"],
    ];

    // ====== 질문(32) ======
    const QUESTIONS = [
      // G 1-8
      "누군가를 좋아하게 되기 전부터, 이미 감정이 준비되어 있던 것 같다",
      "특정한 한 사람을 만나지 않았다면 이런 감정은 생기지 않았을 것이다",
      "대상이 바뀌어도 비슷한 감정을 다시 느낀 적이 있다",
      "“이 사람이어서”라는 이유가 내 감정의 대부분을 차지한다",
      "감정은 나에게서 나오지만, 방향은 상대가 정한다",
      "사랑은 내 안의 상태에 따라 발생한다고 느낀다",
      "좋아하는 사람이 사라져도 감정의 흔적은 오래 남는다",
      "이 감정은 오직 그 사람에게서만 시작되었다고 느낀다",
      // R 9-16
      "설명할 수 없어도 사랑은 유지될 수 있다고 느낀다",
      "상대의 행동에 대한 이유를 알아야 감정이 지속된다",
      "믿음이 깨져도 감정 자체는 남아 있을 수 있다",
      "납득되지 않으면 마음이 빠르게 식는 편이다",
      "“그래도”라는 말로 상대의 감정을 붙잡은 경험이 있다",
      "관계에는 분명한 근거와 맥락이 필요하다고 생각한다",
      "확신이 없어도 감정이 계속된 적이 있다",
      "설명되지 않는 감정은 오래 갈 수 없다고 느낀다",
      // U 17-24
      "감정의 중심은 비교적 잘 변하지 않는 편이다",
      "상대의 변화에 따라 감정도 함께 움직인다",
      "내가 흔들리지 않으면 관계도 유지된다고 느낀다",
      "관계는 상황에 따라 자연스럽게 변한다고 생각한다",
      "내가 관계의 기준을 잡고 있는 경우가 많다",
      "흐름을 거스르기보다 받아들이는 편이다",
      "관계에서 오래 같은 자리에 머무는 편이다",
      "감정이 변화하는 것을 자연스럽게 받아들인다",
      // A 25-32
      "좋아하는 인물의 서사에 나를 투영하여 생각한다",
      "인물은 인물로 두고 바라보는 편이다",
      "그 사람의 선택을 나의 감정처럼 느낀다",
      "관찰하는 거리감이 편안하다",
      "“내가 그 입장이라면”같은 가정을 자주 상상한다",
      "나는 이야기속에 직접 들어가지 않는다",
      "서사를 바꾸거나 보완하는 상상을 한다",
      "있는 그대로의 이야기를 존중하는 편이다",
    ];

    // ====== 매핑 ======
    const G_INNER = [1,3,6,7];
    const G_OUTER = [2,4,5,8];
    const R_FAITH = [9,11,13,15];
    const R_EVID  = [10,12,14,16];
    const U_ANCHOR = [17,19,21,23];
    const U_FLOW   = [18,20,22,24];
    const A_PART   = [25,27,29,31];
    const A_OBS    = [26,28,30,32];

    // ====== 이미지 경로 ======
   const IMAGES = {
  "I-F-A-P": "images/archivist.png",
  "I-F-A-B": "images/witness.png",
  "I-F-L-P": "images/author.png",
  "I-F-L-B": "images/curator.png",
  "I-E-A-P": "images/analyst.png",
  "I-E-A-B": "images/observer-a.png",
  "I-E-L-P": "images/strategist.png",
  "I-E-L-B": "images/focusing-a.png",
  "O-F-A-P": "images/devotee.png",
  "O-F-A-B": "images/sentinel.png",
  "O-F-L-P": "images/resonator.png",
  "O-F-L-B": "images/librarian.png",
  "O-E-A-P": "images/confessor.png",
  "O-E-A-B": "images/archivist-o.png",
  "O-E-L-P": "images/adapter.png",
  "O-E-L-B": "images/focusing.png",
};

    // ====== DOM ======
    const questionsEl = document.getElementById("questions");
    const progText = document.getElementById("progText");
    const fill = document.getElementById("fill");
    const noticeBox = document.getElementById("noticeBox");

    const showResultBtn = document.getElementById("showResultBtn");
    const resetBtn = document.getElementById("resetBtn");

    const resultImgWrap = document.getElementById("resultImgWrap");
    const resultImg = document.getElementById("resultImg");
    const imgErr = document.getElementById("imgErr");
    const imgDebug = document.getElementById("imgDebug");

    let alreadyCalculated = false;

    function build_questions(){
      questionsEl.innerHTML = "";
      QUESTIONS.forEach((text, idx) => {
        const i = idx + 1;
        const card = document.createElement("div");
        card.className = "qcard";

        const p = document.createElement("p");
        p.className = "q";
        p.innerText = `Q${i}. ${text}`;

        const sel = document.createElement("select");
        sel.id = `q${i}`;

        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.text = "선택하세요";
        placeholder.disabled = true;
        placeholder.selected = true;
        sel.appendChild(placeholder);

        OPTIONS.forEach(([val, label]) => {
          const opt = document.createElement("option");
          opt.value = val;
          opt.text = label;
          sel.appendChild(opt);
        });

        sel.value = "";

        sel.addEventListener("change", () => {
          updateProgress();
          checkAutoCalc();
        });

        card.appendChild(p);
        card.appendChild(sel);
        questionsEl.appendChild(card);
      });

      updateProgress();
    }

    function getAnsweredCount(){
      let cnt = 0;
      for (let i=1; i<=32; i++){
        const el = document.getElementById(`q${i}`);
        if (el && el.value !== "") cnt++;
      }
      return cnt;
    }

    function updateProgress(){
      const answered = getAnsweredCount();
      progText.innerText = `진행 ${answered} / 32`;
      fill.style.width = `${(answered/32)*100}%`;

      showResultBtn.disabled = (answered !== 32);

      if (answered === 32){
        noticeBox.innerHTML = `<b>완료!</b> 자동으로 결과가 표시됩니다. (또는 ‘결과 보기’ 클릭)`;
      } else {
        noticeBox.innerHTML = `<b>결과가 안 뜨면</b> 아직 ${32-answered}문항이 미완료입니다.`;
      }
    }

    function score(qnum){
      const el = document.getElementById(`q${qnum}`);
      if (!el || el.value === "") return 0;
      return parseInt(el.value, 10);
    }

    function ssum(nums){
      return nums.reduce((acc, n) => acc + score(n), 0);
    }

    function calcTypeCode(){
      const g_inner = ssum(G_INNER), g_outer = ssum(G_OUTER);
      const r_faith = ssum(R_FAITH), r_evid  = ssum(R_EVID);
      const u_anchor= ssum(U_ANCHOR), u_flow = ssum(U_FLOW);
      const a_part  = ssum(A_PART),   a_obs  = ssum(A_OBS);

      const G = (g_inner >= g_outer) ? "I" : "O";
      const R = (r_faith >= r_evid)  ? "F" : "E";
      const U = (u_anchor >= u_flow) ? "A" : "L";
      const A = (a_part >= a_obs)    ? "P" : "B";
      return `${G}-${R}-${U}-${A}`;
    }

    function showResultImage(code){
      imgErr.style.display = "none";
      imgErr.textContent = "";
      imgDebug.textContent = "";

      const raw = IMAGES[code] || "";
      if (!raw){
        imgErr.style.display = "block";
        imgErr.textContent = `이미지 매핑이 없습니다.\ncode=${code}`;
        resultImgWrap.style.display = "block";
        resultImgWrap.scrollIntoView({behavior:"smooth", block:"start"});
        return;
      }

      // 현재 페이지 기준으로 절대 URL로 변환 (Pages 하위 경로 안전)
      const abs = new URL(raw, window.location.href).href;

      imgDebug.innerHTML =
        `TYPE: <b>${code}</b><br/>` +
        `IMG: <a class="link" href="${abs}" target="_blank" rel="noreferrer">${abs}</a>`;

      resultImg.src = abs + `?v=${Date.now()}`;

      resultImg.onload = () => {
        resultImgWrap.style.display = "block";
        resultImgWrap.scrollIntoView({behavior:"smooth", block:"start"});
      };

      resultImg.onerror = () => {
        imgErr.style.display = "block";
        imgErr.textContent =
          `이미지 로딩 실패\n` +
          `- 요청 URL: ${resultImg.src}\n\n` +
          `원인 후보:\n` +
          `1) images 폴더/파일이 repo에 실제로 없음 (커밋/푸시)\n` +
          `2) 파일명 대소문자 불일치 (GitHub Pages는 엄격)\n` +
          `3) 확장자 불일치 (.jpg/.png/.jpeg)\n`;
        resultImgWrap.style.display = "block";
        resultImgWrap.scrollIntoView({behavior:"smooth", block:"start"});
      };
    }

    function checkAutoCalc(){
      const answered = getAnsweredCount();
      if (answered === 32 && !alreadyCalculated){
        alreadyCalculated = true;
        showResultImage(calcTypeCode());
      }
    }

    function reset_all(){
      alreadyCalculated = false;
      for (let i=1; i<=32; i++){
        const el = document.getElementById(`q${i}`);
        if (el) el.value = "";
      }
      updateProgress();
      resultImgWrap.style.display = "none";
      resultImg.src = "";
      imgErr.style.display = "none";
      imgErr.textContent = "";
      imgDebug.textContent = "";
      window.scrollTo({top:0, behavior:"smooth"});
    }

    // 버튼
    showResultBtn.addEventListener("click", () => {
      if (getAnsweredCount() !== 32) return;
      alreadyCalculated = true;
      showResultImage(calcTypeCode());
    });
    resetBtn.addEventListener("click", reset_all);

    // 최초 렌더
    build_questions();
  </script>
</body>
</html>
